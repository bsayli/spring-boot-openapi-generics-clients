          type: string
          format: date-time
        sort:
          type: array
          items:
            $ref: "#/components/schemas/Sort"
      x-ignore-model: true
    ServiceResponseWindowTypeSummaryDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/WindowTypeSummaryDto"
        meta:
          $ref: "#/components/schemas/Meta"
      x-api-wrapper: true
      x-api-wrapper-datatype: WindowTypeSummaryDto
