openapi: 3.1.0

info:
  title: Multi-task Customer API
  version: 1.3.0-SNAPSHOT

paths: {}

components:
  schemas:
    CustomerDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Meta:
      type: object
      properties:
        serverTime:
          type: string
          format: date-time
      x-ignore-model: true

    ServiceResponseCustomerDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/CustomerDto"
        meta:
          $ref: "#/components/schemas/Meta"
      x-api-wrapper: true
      x-api-wrapper-type: io.github.blueprintplatform.openapi.generics.contract.envelope.ServiceResponse
      x-api-wrapper-datatype: CustomerDto
