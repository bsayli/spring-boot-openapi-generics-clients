name: Build & Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and install core modules
        run: mvn -B -ntp clean install

      - name: Upload contract coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./openapi-generics-contract/target/site/jacoco/jacoco.xml
          flags: contract
          name: contract
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Upload server starter coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./openapi-generics-server-starter/target/site/jacoco/jacoco.xml
          flags: server-starter
          name: server-starter
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Upload Java codegen coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./openapi-generics-java-codegen/target/site/jacoco/jacoco.xml
          flags: java-codegen
          name: java-codegen
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Set up JDK 25 for samples
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Build samples (end-to-end validation)
        run: mvn -B -ntp -f samples/pom.xml clean verify

      - name: Verify generated specs are committed
        run: git diff --exit-code -- samples